# Generate the Xcode project with:  brew install xcodegen && xcodegen
name: MacroRouter
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  MacroCore:
    path: Packages/MacroCore
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"

targets:
  MacroRouter:
    type: application
    platform: iOS
    sources:
      - path: MacroRouter
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    info:
      path: MacroRouter/Info.plist
      properties:
        CFBundleDisplayName: Macro Router
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        USDA_API_KEY: $(USDA_API_KEY)
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        OTHER_LDFLAGS: $(inherited) -ObjC
    dependencies:
      - package: MacroCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore

schemes:
  MacroRouter:
    build:
      targets:
        MacroRouter: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: MacroCore/MacroCoreTests
